spring.application.name=gestao-estoque

# Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/estoque_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Faz o Hibernate mostrar o SQL no console (bom pra aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false   

# Segurança (JWT)
app.jwt.secret=${JWT_SECRET:57308043745079912404627973943411:}
app.jwt.expiracao-minutos=60

# Usuário administrador criado automaticamente na primeira execução
app.admin.email=admin@estoque.com
app.admin.senha=${ADMIN_PASSWORD:admin123}